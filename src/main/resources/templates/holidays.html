<!DOCTYPE html>
<html lang="en">
<head th:replace="~{headerfragment::headFragment}"></head>
<head>
    <!-- link user css -->
    <link rel="stylesheet" href="/resources/css/holidays.css">
</head>

<body>

<div class="container-fluid">
    <!-- link side bar -->
    <nav th:replace="~{sidebar::sidebarFragment}"></nav>

    <div class="row mt-2 title-row">
        <div class="div-title p-1 text-center fw-bold">
            <div class="d-flex align-items-center justify-content-center">
                <img class="icon-img me-2" src="/resources/images/calendar.png" alt="">
                <h3 class="fw-bold main-text">Library Holidays Management</h3>
            </div>
        </div>

    </div>
    <!-- tab panes -->
    <ul class="nav nav-pills" id="tabPills" role="tablist">
        <li class="nav-item" role="presentation">
            <button data-bs-toggle="pill" data-bs-target="#libraryHolidaysTabPillForm" class="nav-link text-light m-1 active pill-tab"
                    id="libraryHolidaysFormPill" type="button" aria-controls="libraryHolidaysTabPillForm" role="tab" aria-selected="true">
                <h6 class="fw-bold tab-name">Library Holidays Form</h6>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button data-bs-toggle="pill" data-bs-target="#libraryHolidaysTabPillTable" class="nav-link text-light m-1"
                    id="libraryHolidaysTablePill" type="button" aria-controls="libraryHolidaysTabPillTable" role="tab" aria-selected="false">
                <h6 class="fw-bold tab-name">Library Holidays Table</h6>

            </button>
        </li>
    </ul>
    <div class="tab-content" id="pillTabContent">
        <!-- form -->
        <div class="tab-pane fade show active" id="libraryHolidaysTabPillForm" role="tabpanel" aria-labelledby="libraryHolidaysTabPillForm"
             tabindex="0">
            <div class="card m-1">
                <div class="card-body">
                            <form onsubmit="return false" id="holidaysForm" class="p-1">
                                <!-- required field row -->
                                <div class="row">
                                    <div class="col text-end fw-bold">
                                        <p class="required-fields">Required Fields <span
                                                class="text-danger">*</span></p>
                                    </div>
                                </div>
                                <!-- year and month -->
                                <div class="row">
                                    <div class="col-3"></div>
                                    <div class="col-3">
                                    <div class="input-group">
                                        <label for="radioHolidayYear" class="form-label fw-bold checkbox-radio-label">Year : <span
                                                class="text-danger">*</span></label>
                                        <div id="radioHolidayYear" class="form-check d-flex gap-3 align-items-center"></div>
                                    </div>
                                </div>
                                    <div class="col-3">
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <label for="selectMonth" class="form-label fw-bold">Month :
                                                <span class="text-danger">*</span></label>
                                        </span>
                                        <select name="" id="selectMonth" class="form-select"
                                                onchange="this.style.borderBottom='2px solid lightgreen'; generateDates()"
                                                required data-bs-toggle="tooltip"
                                                data-bs-placement="bottom" data-bs-title="Select Month">
                                        </select>
                                    </div>
                                </div>
                                    <div class="col-3"></div>
                                </div>
                                <!-- date checking table  -->
                                <div class="row m-1 mt-2">
                                    <table class="table table-bordered" id="tableAddHolidays">
                                        <thead id="tableHeadAddHolidays" class="table-head text-center">
                                        <th></th>
                                        <th>Date</th>
                                        <th>Day</th>
                                        <th>Holiday Title</th>
                                        </thead>
                                        <tbody id="tableBodyAddHolidays" class="table-head text-center">
                                        </tbody>
                                    </table>
                                </div>
                            </form>
                </div>
                <div class="card-footer">
                    <!-- buttons -->
                    <div class="row">
                        <div class="col-6">

                        </div>

                        <div class="col-6 text-end">
                            <button class="btn fw-bold form-btn button-clear" id="buttonClear" type="button">
                                <i class="fa-solid fa-recycle" style="color: #a3a3a3;"></i>
                                Clear
                            </button>


<!--                            <button class="btn fw-bold form-btn button-print" id="buttonPrint" type="button"-->
<!--                                    onclick="printHolidayRecord(window['editOb'])">-->
<!--                                <i class="fa-solid fa-print" style="color: #006eff;"></i>-->
<!--                                Print-->
<!--                            </button>-->


<!--                            <button class="btn fw-bold form-btn button-delete" id="buttonDelete" type="button"-->
<!--                                    onclick="deleteHolidayRecord(window['editOb'])">-->
<!--                                <i class="fa-solid fa-trash" style="color: #fa0000;"></i>-->
<!--                                Delete-->
<!--                            </button>-->

<!--                            <button class="btn fw-bold form-btn button-update" id="buttonUpdate" type="submit"-->
<!--                                    onclick="updateHolidayButton()">-->
<!--                                <i class="fa-solid fa-pen-to-square" style="color: #ffa600;"></i>-->
<!--                                Update-->
<!--                            </button>-->


                            <button class="btn fw-bold form-btn button-submit" id="buttonSubmit" type="submit"
                                    onclick="submitHolidayButton()">
                                <i class="fa-solid fa-floppy-disk" style="color: #00c86e;"></i>
                                Submit
                            </button>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tab-content">
        <!-- Table -->
        <div class="tab-pane fade " id="libraryHolidaysTabPillTable" role="tabpanel" aria-labelledby="libraryHolidaysTabPillTable" tabindex="0">
            <div class="card m-1">
                <div class="card-body">
                    <table class="table table-bordered" id="tableLibraryHolidays">
                        <thead id="tableHeadLibraryHolidays" class="table-head text-center">
                        <tr>
                            <th>#</th>
                            <th>Holiday Title</th>
                            <th>Date</th>
                            <th>Day</th>
                        </tr>
                        </thead>
                        <tbody id="tableBodyLibraryHolidays" class="table-body text-center"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<!--modal User view-->
<div th:replace="~{footerfragment::bottomFragment}"></div>
<script src="controljs/holidays.js"></script>

</body>

</html>
