<!DOCTYPE html>
<html lang="en">
<head th:replace="~{headerfragment::headFragment}"></head>
<head>
    <!-- link payment css -->
    <link rel="stylesheet" href="/resources/css/payment.css">
</head>

<body>
    <div class="container-fluid">
        <!-- link side bar -->
        <nav th:replace="~{sidebar::sidebarFragment}"></nav>
        <!-- title area -->
        <div class="row mt-2 title-row">
            <div class="div-title p-1 text-center">
                <div class="d-flex align-items-center justify-content-center">
                    <img class="icon-img me-2" src="/resources/images/payment.png" alt="">
                    <h3 class="fw-bold main-text">Member Payment Management</h3>
                </div>
            </div>
        </div>
        <!-- tab pills -->
        <ul class="nav nav-pills" id="tabPills" role="tablist">
            <li class="nav-item" role="presentation">
                <button data-bs-toggle="pill" data-bs-target="#paymentTabPillForm"
                    class="nav-link text-light m-1 active pill-tab" id="paymentFormPill" type="button"
                    aria-controls="paymentTabPillForm" role="tab" aria-selected="true">
                    <h6 class="fw-bold tab-name">Member Payment Form</h6>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button data-bs-toggle="pill" data-bs-target="#paymentTabPillTable"
                    class="nav-link text-light m-1 pill-tab" id="paymentTablePill" type="button"
                    aria-controls="paymentTabPillTable" role="tab" aria-selected="false">
                    <h6 class="fw-bold tab-name">Member Payment Table</h6>
                </button>
            </li>
        </ul>
        <div class="tab-content" id="pillsTabContent">
            <!-- form -->
            <div class="tab-pane fade show active" id="paymentTabPillForm" role="tabpanel"
                aria-labelledby="paymentTabPillForm" tabindex="0">
                <div class="card m-1">
                    <div class="card-body">
                        <form onsubmit="return false" class="p-1" id="paymentForm">
                            <div class="row">
                                <div class="col-7">
                                    <div class="row"></div>
                                    <!-- member id -->
                                    <div class="row mt-5">
                                        <div class="col-2"></div>

                                        <div class="col-8">
                                            <div class="input-group">
                                            <span class="input-group-text">
                                                <label for="textMemberNo" class="form-albel fw-bold">Member No :
                                                    <span class="text-danger">*</span>
                                                </label>
                                            </span>
                                                <input type="text" id="textMemberNo" placeholder="Enter Member No"
                                                       class="form-control input-area" required data-bs-toggle="tooltip"
                                                       data-bs-placement="bottom" data-bs-title="Enter Member No">
                                            </div>
                                        </div>
                                        <div class="col-2"></div>
                                    </div>
                                    <div class="row mt-3">
                                        <div class="col">
                                            <div class="card member-name-photo-card p-2">
                                                <div class="row">
                                                    <div class="col-2" >
                                                        <img src="/resources/images/memberdefault.png" id="imgMemberPhoto" class=" member-img d-flex align-items-center justify-content-center">
                                                    </div>
                                                    <div class="col-10">
                                                        <div class="row mt-2 align-items-center">
                                                            <div class="col-5 fw-bold normal-text">Member Name</div>
                                                            <div class="col-1 fw-bold normal-text">:</div>
                                                            <div class="col-6 fw-bold normal-text"
                                                                 id="textMemberName"></div>
                                                        </div>
                                                        <div class="row mt-2 align-items-center">
                                                            <div class="col-5 fw-bold normal-text">Member Status</div>
                                                            <div class="col-1 fw-bold normal-text">:</div>
                                                            <div class="col-6 fw-bold normal-text"
                                                                 id="textMemberStatus"></div>
                                                        </div>
<!--                                                        <div class="row mt-2 align-items-center">-->
<!--                                                            <div class="col-5 fw-bold normal-text">Membership Type</div>-->
<!--                                                            <div class="col-1 fw-bold normal-text">:</div>-->
<!--                                                            <div class="col-6 fw-bold normal-text"-->
<!--                                                                 id="textExistingMembership"></div>-->
<!--                                                        </div>-->
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <!-- payment type -->
                                        <div class="col-6">
                                            <div class="input-group">
                                        <span class="input-group-text">
                                            <label for="selectPaymentType" class="form-albel fw-bold">Payment Type :
                                                <span class="text-danger">*</span></label>
                                        </span>
                                                <select name="" id="selectPaymentType" class="form-select input-area" required
                                                        data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Select Payment Type"
                                                        onchange="this.style.borderBottom='2px solid lightgreen';
                                                        payment.paymenttype_id=JSON.parse(this.value);">
                                                    <option value="" selected disabled>Select Payment Type</option>
                                                </select>
                                            </div>
                                        </div>
                                        <!-- method -->
                                        <div class="col-6">
                                            <div class="input-group">
                                        <span class="input-group-text">
                                            <label for="selectPaymentMethod" class="form-albel fw-bold">Payment Method :
                                                <span class="text-danger">*</span></label>
                                        </span>
                                                <select name="" id="selectPaymentMethod" class="form-select input-area" required
                                                        data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Select Payment Method"
                                                        onchange="this.style.borderBottom='2px solid lightgreen';
                                                        payment.memberpaymentmethod_id=JSON.parse(this.value);">
                                                    <option value="" selected disabled>Select Payment Method</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                                <div class="col-5">
                                    <!-- required mark -->
                                    <div class="row">
                                        <div class="col text-end fw-bold">
                                            <p class="required-fields">Required Fields <span class="text-danger">*</span></p>
                                        </div>
                                    </div>

                                    <div class="row mt-3">
                                        <!-- amount -->
                                        <div class="input-group">
                                        <span class="input-group-text">
                                            <label for="numberAmount" class="form-albel fw-bold">Amount : <span
                                                    class="text-danger">*</span></label>
                                        </span>
                                            <span class="input-group-text static-name">
                                            <label for="numberAmount" class="form-label">Rs.</label>
                                        </span>
                                            <input type="number" id="numberAmount" class="form-control input-area" required
                                                   onkeyup=" textElementValidator(this,'^([1-9][0-9]{1,4})$','payment','amount')">
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <!-- received amount -->
                                        <div class="input-group">
                                        <span class="input-group-text">
                                            <label for="numberReceivedAmount" class="form-albel fw-bold">Received Amount
                                                : <span class="text-danger">*</span></label>
                                        </span>
                                            <span class="input-group-text static-name">
                                            <label for="numberReceivedAmount" class="form-label">Rs.</label>
                                        </span>
                                            <input type="number" id="numberReceivedAmount"
                                                   placeholder="Enter Received Amount" class="form-control input-area" required
                                                   data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Enter Received Amount"
                                                   onkeyup=" validateReceivedAmount(); getBalance()"

                                            >
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <!-- balance -->
                                        <div class="input-group">
                                        <span class="input-group-text">
                                            <label for="numberBalance" class="form-albel fw-bold">Balance : <span
                                                    class="text-danger">*</span></label>
                                        </span>
                                            <span class="input-group-text static-name">
                                            <label for="numberBalance" class="form-label">Rs.</label>
                                        </span>
                                            <input type="number" id="numberBalance" class="form-control input-area"
                                                   required onkeyup=" textElementValidator(this,'^([0-9]{1,5})$','payment','balance')" disabled>
                                        </div>
                                    </div>
                                    <div class="row mt-3" id="referenceNoRow">
                                        <!-- reference no  -->
                                        <div class="input-group">
                                        <span class="input-group-text">
                                            <label for="textReferenceNumber" class=" fw-bold form-label d-flex align-items-center gap-1">Reference Number
                                                : <span class="text-danger" id="starReferenceNo">*</span></label>
                                        </span>
                                            <input type="text" id="textReferenceNumber" placeholder="Enter Reference No"
                                                   class="form-control input-area" data-bs-toggle="tooltip"

                                                   data-bs-placement="bottom" data-bs-title="Enter Reference No"
                                                   onkeyup="textElementValidator(
                                         this,
                                         '^[A-Za-z0-9-_]{6,25}$',
                                         'payment',
                                         'referenceno'
                                        );">
                                        </div>
                                    </div>
                                    <div class="row mt-3">
                                        <!-- note  -->
                                        <div class="input-group">
                                        <span class="input-group-text">
                                            <label for="textNote" class="form-albel fw-bold">Note : </label>
                                        </span>
                                            <textarea name="" class="form-control input-area" id="textNote"
                                                      placeholder="Enter Note" data-bs-toggle="tooltip" data-bs-placement="bottom"
                                                      data-bs-title="Enter Note" onkeyup="textElementValidator(
                                         this,
                                         '^([A-Za-z0-9\\.\\-\\/\\s\\,]{2,15})+$',
                                         'payment',
                                         'note'
                                        );"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- buttons -->
                            <div class="row mt-3">
                                <div class="col-6">

                                </div>

                                <div class="col-6 text-end">
                                    <button class="btn fw-bold form-btn button-clear" id="buttonClear" type="reset">
                                        <i class="fa-solid fa-recycle" style="color: #a3a3a3;"></i>
                                        Clear
                                    </button>


                                    <button class="btn fw-bold form-btn button-print" id="buttonPrint" type="button"
                                    onclick="printPaymentRecord(window['editOb'])">
                                        <i class="fa-solid fa-print" style="color: #006eff;"></i>
                                        Print
                                    </button>

                                    <button class="btn fw-bold form-btn button-submit" id="buttonSubmit" type="submit"
                                    onclick="buttonPaymentSubmit()">
                                        <i class="fa-solid fa-floppy-disk" style="color: #00c86e;"></i>
                                        Submit
                                    </button>

                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!-- table -->
            <div class="tab-pane fade" id="paymentTabPillTable" role="tabpanel" aria-labelledby="paymentTabPillTable"
                tabindex="0">
                <div class="card m-1">
                    <div class="card-body">
                        <table class=" table table-bordered" id="tablePayment">
                            <thead id="tableHeadPayment" class="table-head text-center">
                                <tr>
                                    <th>#</th>
                                    <th>Payment No</th>
                                    <th>Member No</th>
                                    <th>Member Name</th>
                                    <th>Payment Type</th>
                                    <th>Payment Method</th>
                                    <th>Amount</th>
                                    <th>Reference No</th>
                                </tr>
                            </thead>
                            <tbody id="tableBodyPayment" class="table-body text-center"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="modalPaymentView" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>View Payment</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="card" id="divCardPrintPayment">
                        <div class="card-header">
                            <h1>Payment details</h1>
                        </div>
                        <div class="card-body">
                            <table class="table table-hover table-striped table-bordered ">
                                <tr>
                                    <th>Payment No</th>
                                    <td id="tdPaymentNo"></td>
                                </tr>
                                <tr>
                                    <th>Member No</th>
                                    <td id="tdMemberNo"></td>
                                </tr>
                                <tr>
                                    <th>Member Name</th>
                                    <td id="tdMemberName"></td>
                                </tr>
                                <tr>
                                    <th>Payment Type</th>
                                    <td id="tdPaymentType"></td>
                                </tr>
                                <tr>
                                    <th>Payment Method</th>
                                    <td id="tdPaymentMethod"></td>
                                </tr>
                                <tr>
                                    <th>Amount</th>
                                    <td id="tdAmount"></td>
                                </tr>
                                <tr>
                                    <th>Reference No</th>
                                    <td id="tdReferenceNo"></td>
                                </tr>
                                <tr>
                                    <th>Note</th>
                                    <td id="tdNote"></td>
                                </tr>

                            </table>
                        </div>
                    </div>

                </div>
                <div class="modal-footer text-end">
                    <button type="button" class="btn" onclick="printPayment()">Print</button>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{footerfragment::bottomFragment}"></div>
    <!-- link payment js -->
    <script src="controljs/payment.js"></script>
</body>

</html>
