<!DOCTYPE html>
<html lang="en">
<head th:replace="~{headerfragment::headFragment}"></head>
<head>
  <!-- link user css -->
  <link rel="stylesheet" href="/resources/css/user.css">
</head>

<body>

  <div class="container-fluid">
    <!-- link side bar -->
    <nav th:replace="~{sidebar::sidebarFragment}"></nav>

    <div class="row mt-2 title-row">
      <div class="div-title p-1 text-center fw-bold">
        <div class="d-flex align-items-center justify-content-center">
          <img class="icon-img me-2" src="/resources/images/user.png" alt="">
          <h3 class="fw-bold main-text">User Management</h3>
        </div>
      </div>

    </div>
    <!-- tab panes -->
    <ul class="nav nav-pills" id="tabPills" role="tablist">
      <li class="nav-item" role="presentation">
        <button data-bs-toggle="pill" data-bs-target="#userTabPillForm" class="nav-link text-light m-1 active pill-tab"
          id="userFormPill" type="button" aria-controls="userTabPillForm" role="tab" aria-selected="true">
          <h6 class="fw-bold tab-name">User Form</h6>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button data-bs-toggle="pill" data-bs-target="#userTabPillTable" class="nav-link text-light m-1"
          id="userTablePill" type="button" aria-controls="userTabPillTable" role="tab" aria-selected="false">
          <h6 class="fw-bold tab-name">User Table</h6>

        </button>
      </li>
    </ul>
    <div class="tab-content" id="pillTabContent">
      <!-- form -->
      <div class="tab-pane fade show active" id="userTabPillForm" role="tabpanel" aria-labelledby="userTabPillForm"
        tabindex="0">
        <div class="card m-1">
          <div class="card-body">
            <form action="" id="formUser" onsubmit="return false" class="p-1">
              <!-- required mark -->
              <div class="row">
                <div class="col text-end fw-bold">
                  <p class="required-fields">Required Fields <span class="text-danger">*</span></p>
                </div>
              </div>
              <div class="row">
                  <!-- user type -->
<!--                <div class="col-4">-->
<!--                 -->
<!--                   <label for="radioEmployee" class="form-label fw-bold checkbox-radio-label">User Type :-->
<!--                    <span class="text-danger">*</span>-->
<!--                  </label>-->
<!--                  <div class="form-check form-check-inline" style="margin-left: 20px;">-->
<!--                    <input  type="radio" id="radioEmployee"-->
<!--                      class="form-check-input input-radio" value="Employee" name="usertype" onclick="toggleUserType('Employee')">-->
<!--                    <label for="radioEmployee" class="form-check-label checkbox-radio-label">Employee</label>-->
<!--                  </div>-->
<!--                  <div class="form-check form-check-inline" style="margin-left: 20px;">-->
<!--                    <input  type="radio" id="radioMember"-->
<!--                      class="form-check-input input-radio" value="Member" name="usertype" onclick="toggleUserType('Member')">-->
<!--                    <label for="radioMember" class="form-check-label checkbox-radio-label">Member</label>-->
<!--                  </div>-->
<!--                </div>-->
                <!-- employee -->
                <div class="col-6">
                  <div class="input-group">
                    <span class="input-group-text">
                      <label for="selectEmployee" class="form-label fw-bold">
                        Employee : <span class="text-danger">*</span>
                      </label>
                    </span>
                    <select id="selectEmployee" name="employee" class="form-select input-area"  data-bs-toggle="tooltip"
                      data-bs-placement="bottom" data-bs-title="Select Employee"
                            onchange="user.employee_id=JSON.parse(this.value);
                      this.style.borderBottom='2px solid lightgreen';">
                      <option value="" selected disabled>Select Employee</option>
                    </select>
                  </div>


                </div>
                <!-- member -->
<!--                <div class="col-4" style="display: none;" id="memberList">-->
<!--                  <div class="input-group">-->
<!--                    <span class="input-group-text">-->
<!--                      <label for="selectMember" class="form-label fw-bold">-->
<!--                        Member : <span class="text-danger">*</span>-->
<!--                      </label>-->
<!--                    </span>-->
<!--                    <select id="selectMember" name="member" class="form-select input-area"  data-bs-toggle="tooltip"-->
<!--                      data-bs-placement="bottom" data-bs-title="Select Member"  >-->
<!--                      <option value="" selected disabled>Select Member</option>-->
<!--                    </select>-->
<!--                  </div>-->


<!--                </div>-->
                <div class="col-6">
                   <!-- user name -->
                  <div class="input-group">
                    <span class="input-group-text">
                      <label for="textUserName" class="form-label fw-bold">
                        User Name : <span class="text-danger">*</span>
                      </label>
                    </span>
                    <input type="text" placeholder="Enter User Name" class="form-control input-area" id="textUserName"
                      required onkeyup="textElementValidator(this,'^([A-Za-z0-9\\#]{5,20})$','user','username')"
                      data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Enter User Name">
                  </div>
                </div>
              </div>
              <!-- password + retype password -->
              <div class="row mt-3">
                <!-- password -->
                <div class="col-6">
                  <div class="input-group">
                    <span class="input-group-text">
                      <label for="textPassword" class="form-label fw-bold">
                        Password : <span class="text-danger">*</span>
                      </label>
                    </span>
                    <input type="password" placeholder="Enter Password" class="form-control input-area"
                      id="textPassword"
                      onkeyup="textElementValidator(this,'^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d@]{6,}$','user','password')"
                      required data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Enter Password">
                  </div>
                </div>
                <!-- retype password -->
                <div class="col-6">
                  <div class="input-group">
                    <span class="input-group-text">
                      <label for="textRetypePassword" class="form-label fw-bold">
                        Retype Password : <span class="text-danger">*</span>
                      </label>
                    </span>
                    <input type="password" placeholder="Enter Password Again" class="form-control input-area"
                      id="textRetypePassword" required data-bs-toggle="tooltip" data-bs-placement="bottom"
                      data-bs-title="Enter Password Again">
                  </div>
                </div>
              </div>
              <!-- Email + Note -->
              <div class="row mt-3">
                <!-- email -->
                <div class="col-6">
                  <div class="input-group">
                    <span class="input-group-text">
                      <label for="textEmail" class="form-label fw-bold">
                        Email : <span class="text-danger">*</span>
                      </label>
                    </span>
                    <input type="email" placeholder="Enter Email Address" class="form-control input-area" id="textEmail"
                      required onkeyup="textElementValidator(
                                             this,
                                             '^[A-Za-z0-9\\%\\#]{5,25}[@][a-z]{5,8}[.][a-z]{2,3}$',
                                             'user',
                                             'email'
                                            );" data-bs-toggle="tooltip" data-bs-placement="bottom"
                      data-bs-title="Enter Email">
                  </div>


                </div>
                <!-- note -->
                <div class="col-6">
                  <div class="input-group">
                    <span class="input-group-text">
                      <label for="textNote" class="form-label fw-bold">
                        Note :
                      </label>
                    </span>
                    <textarea placeholder="Enter Note" class="form-control input-area" id="textNote" onkeyup="textElementValidator(
                                          this,
                                          '^([A-Za-z0-9\\.\\-\\/\\s\\,]{2,15})+$',
                                          'user',
                                          'note'
                                        );" data-bs-toggle="tooltip" data-bs-placement="bottom"
                      data-bs-title="Enter Note"></textarea>
                  </div>


                </div>
              </div>

              <!-- role + status -->
              <div class="row mt-3">
                <!-- role -->
                <div class="col-6">
                  <label for="divRoleParent" class=" col-4 fw-bold checkbox-radio-label">
                    Role : <span class="text-danger">*</span>
                  </label>

                  <div class="col-8" style="margin-left: 70px; " id="divRoleParent">
                  </div>


                </div>
                <!-- status -->
                <div class="col-6">
                  <label for="divStatusParent" class="col-4 form-label fw-bold checkbox-radio-label">
                    Status : <span class="text-danger">*</span>
                  </label>
                  <div class="col-8" id="divStatusParent">
                    <div class="form-check form-check-inline">
                      <input type="checkbox" class="form-check-input input-checkbox" id="checkUserStatus" 
                      onclick="if(this.checked){
                                            user.userstatus=true;
                                            lblUserStatus.innerText='User Account is Active';
                                          }else{
                                            user.userstatus=false;
                                            lblUserStatus.innerText='User Account is In-Active';
                                          }">
                      <label id="lblUserStatus" class="form-check-label checkbox-radio-label" for="checkUserStatus">
                        User Account is
                        Active</label>
                    </div>
                  </div>
                </div>
              </div>

              <!-- buttons -->
              <div class="row mt-3">
                <div class="col-6">

                </div>

                <div class="col-6 text-end">
                    <button class="btn fw-bold form-btn button-clear" id="buttonClear" type="button">
                        <i class="fa-solid fa-recycle" style="color: #a3a3a3;"></i>
                        Clear
                    </button>


                    <button class="btn fw-bold form-btn button-print" id="buttonPrint" type="button"
                            onclick="printUserRecord(window['editOb']);">
                        <i class="fa-solid fa-print" style="color: #006eff;"></i>
                        Print
                    </button>


                    <button class="btn fw-bold form-btn button-delete" id="buttonDelete" type="button"
                            onclick="deleteUserRecord(window['editOb']);">
                        <i class="fa-solid fa-trash" style="color: #fa0000;"></i>
                        Delete
                    </button>

                  <button class="btn fw-bold form-btn button-update" id="buttonUpdate" type="submit" onclick="buttonUserUpdate();">
                    <i class="fa-solid fa-pen-to-square" style="color: #ffa600;"></i>
                    Update
                  </button>


                  <button class="btn fw-bold form-btn button-submit" id="buttonSubmit" type="submit" onclick="buttonUserSubmit()">
                    <i class="fa-solid fa-floppy-disk" style="color: #00c86e;"></i>
                    Submit
                  </button>

                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-content">
      <!-- Table -->
      <div class="tab-pane fade " id="userTabPillTable" role="tabpanel" aria-labelledby="userTabPillTable" tabindex="0">
        <div class="card m-1">
          <div class="card-header">
            <div class="row m-1">
              <div class="col-10"></div>

              <div class="col-1 text-end">
                <div class="d-flex align-items-center">
                  <i class="fa-solid fa-circle-check fa-lg me-1 " style="color:rgb(0, 189, 72);"></i>
                  <span>Active</span>
                </div>
              </div>
              <div class="col-1 text-end">
                <div class="d-flex align-items-center">
                  <i class="fa-solid fa-circle-xmark fa-lg me-1 " style="color: #ff0000;"></i>
                  <span>Inactive</span>
                </div>

              </div>


            </div>
          </div>
          <div class="card-body">
            <table class="table table-bordered" id="tableUser">
              <thead id="tableHeadUser" class="table-head text-center">
                <tr>
                  <th>#</th>
                  <th>Employee Name</th>
                  <th>User Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="tableBodyUser" class="table-body text-center"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!--modal employee View-->
  <div class="modal" id="modalUserView" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h3>View User</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="card" id="divCardPrintUser">
            <div class="card-header">
              <h1>User details</h1>
            </div>
            <div class="card-body">
              <table class="table table-hover table-striped table-bordered ">
                <tr>
                  <th>Employee Fullname</th>
                  <td id="tdFullName"></td>
                </tr>
                <tr>
                  <th>User Name</th>
                  <td id="tdUserName"></td>
                </tr>
                <tr>
                  <th>Email</th>
                  <td id="tdEmail"></td>
                </tr>
                <tr>
                  <th>Note</th>
                  <td id="tdNote"></td>
                </tr>
                <tr>
                  <th>User Roles</th>
                  <td id="tdRoles"></td>
                </tr>
                <tr>
                  <th>User Status</th>
                  <td id="tdUserStatus"></td>
                </tr>

              </table>
            </div>
          </div>

        </div>
        <div class="modal-footer text-end">
          <button type="button" class="btn" onclick="printUser()">Print</button>
        </div>
      </div>
    </div>
  </div>
  <!--modal User view-->
  <div th:replace="~{footerfragment::bottomFragment}"></div>
  <script src="controljs/user.js"></script>

</body>

</html>
