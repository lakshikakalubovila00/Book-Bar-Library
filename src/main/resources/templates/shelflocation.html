<!DOCTYPE html>
<html lang="en">
<head th:replace="~{headerfragment::headFragment}"></head>
<head>
    <!-- link purchase css -->
    <link rel="stylesheet" href="/resources/css/shelflocation.css">
</head>

<body>
<div class="container-fluid">
    <!-- link side bar -->
    <nav th:replace="~{sidebar::sidebarFragment}"></nav>
    <!-- title area -->
    <div class="row mt-2 title-row">

        <div class="div-title p-1 text-center">
            <div class="d-flex align-items-center justify-content-center">
                <img class="icon-img me-2" src="/resources/images/booklocation.png" alt="">
                <h3 class="fw-bold main-text">Shelf Location Management</h3>
            </div>
        </div>
    </div>
    <!-- tab-pills -->
    <ul class="nav nav-pills" id="tabPills" role="tablist">
        <li class="nav-item" role="presentation">
            <button data-bs-toggle="pill" data-bs-target="#shelfLocationTabPillForm"
                    class="nav-link m-1 fw-bold active pill-tab" id="shelfLocationFormPill" type="button"
                    aria-controls="shelfLocationTabPillForm" role="tab" aria-selected="true">
                <h6 class="fw-bold tab-name">Shelf Location Form</h6>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button data-bs-toggle="pill" data-bs-target="#shelfLocationTabPillTable" class="nav-link m-1"
                    id="shelfLocationTablePill" type="button" aria-controls="shelfLocationTabPillTable" role="tab"
                    aria-selected="false">
                <h6 class="fw-bold tab-name">Shelf Location Table</h6>
            </button>
        </li>
    </ul>
    <div class="tab-content" id="pillsTabContent">
        <!-- form -->
        <div class="tab-pane fade show active" id="shelfLocationTabPillForm" role="tabpanel"
             aria-labelledby="shelfLocationTabPillForm" tabindex="0">
            <div class="card m-1">
                <div class="card-body">
                    <div class="row">
                        <!-- main form -->
                        <div class="col-5 main-form">
                            <form onsubmit="return false" id="shelfLocationForm" class="p-1">
                                <!-- required mark -->
                                <div class="row">
                                    <div class="col text-end fw-bold">
                                        <p class="required-fields">Required Fields <span
                                                class="text-danger">*</span></p>
                                    </div>
                                </div>
                                <!--Display Category-->
                                <div class="row">
                                    <div class="col">
                                        <div class="input-group">
                                                <span class="input-group-text">
                                                    <label for="selectDisplayCategory"
                                                           class="form-label fw-bold">Display Category : <span
                                                            class="text-danger">*</span></label>
                                                </span>
                                            <select name="" id="selectDisplayCategory"
                                                    class="form-select input-area" data-bs-toggle="tooltip"
                                                    data-bs-placement="bottom" data-bs-title="Select Display Category"
                                                    onchange="shelflocation.displaycategory_id=JSON.parse(this.value) ;
                                                    this.style.borderBottom='2px solid lightgreen';">
                                                <option value="Select Display Category" selected disabled>
                                                    Select Display Category</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <!--  - inner form -->
                        <div class="col-7 inner-form">
                            <div class="div-title text-center mt-1">
                                <div class="d-flex align-items-center justify-content-center">
                                    <img class="inner-form-icon-img me-2" src="/resources/images/bookcopies.png"
                                         alt="">
                                    <h5 class="fw-bold inner-form-name">Add Locations</h5>
                                </div>
                                <hr style="border: 1px solid rgba(44, 82, 130,0.8);">
                            </div>
                            <form action="" id="shelfLocationsForm" class="p-1">

                                <div class="row mt-2">
                                    <!--building id-->
                                    <div class="col-6">
                                        <div class="input-group">
                                                <span class="input-group-text">
                                                    <label for="selectBuilding" class="form-label fw-bold">Building :
                                                        <span class="text-danger">*</span></label>
                                                </span>
                                            <select name="" id="selectBuilding" class="form-select" required
                                                    data-bs-toggle="tooltip" data-bs-placement="bottom"
                                                    data-bs-title="Select Building"
                                                    onchange="
                                                    this.style.borderBottom='2px solid lightgreen'; filterFloorByBuilding(); ">
                                                <option selected disabled value="Select Building">Select Building</option>
                                            </select>
                                        </div>
                                    </div>
                                    <!--floor id-->
                                    <div class="col-6">
                                        <div class="input-group">
                                                <span class="input-group-text">
                                                    <label for="selectFloor" class="form-label fw-bold">Floor :
                                                        <span class="text-danger">*</span></label>
                                                </span>
                                            <select name="" id="selectFloor" class="form-select" required
                                                    data-bs-toggle="tooltip" data-bs-placement="bottom"
                                                    data-bs-title="Select Floor"
                                                    onchange="
                                                    this.style.borderBottom='2px solid lightgreen'; filterRackByFloor();">
                                                <option selected disabled value="Select Floor">Select Floor</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>


                                <div class="row mt-2">
                                    <!--rack id-->
                                    <div class="col-6">
                                        <div class="input-group">
                                                <span class="input-group-text">
                                                    <label for="selectRack" class="form-label fw-bold">Rack :
                                                        <span class="text-danger">*</span></label>
                                                </span>
                                            <select name="" id="selectRack" class="form-select" required
                                                    data-bs-toggle="tooltip" data-bs-placement="bottom"
                                                    data-bs-title="Select Rack"
                                                    onchange="this.style.borderBottom='2px solid lightgreen'; filterRowByRack()">
                                                <option selected disabled value="Select Rack">Select Rack</option>
                                            </select>
                                        </div>
                                    </div>
                                    <!-- Row No-->
                                    <div class="col-6">
                                        <div class="input-group">
                                                <span class="input-group-text">
                                                    <label for="selectRow" class="form-label fw-bold">Row :
                                                        <span class="text-danger">*</span></label>
                                                </span>
                                            <select name="" id="selectRow" class="form-select" required
                                                    data-bs-toggle="tooltip" data-bs-placement="bottom"
                                                    data-bs-title="Select Row"
                                                    onchange="shelflocationItem.rackrow_id=JSON.parse(this.value)  ;
                                                        this.style.borderBottom='2px solid lightgreen'; genereteLocationCode()">
                                                <option selected disabled value="Select Rack">Select Row</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <!--location code-->
                                <div class="row mt-2">
                                    <div class="col">
                                        <div class="input-group">
                                                <span class="input-group-text">
                                                    <label for="textLocationCode" class="form-label fw-bold">Location Code:
                                                        <span class="text-danger">*</span></label>
                                                </span>
                                            <input type="text" class="form-control input-area" id="textLocationCode" required
                                                   onkeyup="textElementValidator(
                                                    this,
                                                    '^([B][0-9][-][F][0-9][-][R][0-9][-][0-9])$',
                                                    'shelflocationItem',
                                                    'locationcode')">
                                        </div>
                                    </div>
                                </div>

<!--                                <div class="row mt-2">-->
<!--                                    <div class="col">-->
<!--                                        <div class="input-group">-->
<!--                                                <span class="input-group-text">-->
<!--                                                    <label for="selectLocationStatus" class="form-label fw-bold">Shelf Location Status :-->
<!--                                                        <span class="text-danger">*</span></label>-->
<!--                                                </span>-->
<!--                                            <select name="" id="selectLocationStatus" class="form-select" required-->
<!--                                                    data-bs-toggle="tooltip" data-bs-placement="bottom"-->
<!--                                                    data-bs-title="Select Shelf Location Status"-->
<!--                                                    onchange="shelflocationItem.shelflocationstatus_id=JSON.parse(this.value);-->
<!--                                                    this.style.borderBottom='2px solid lightgreen'; ">-->
<!--                                                <option selected disabled value="Select Shelf Location Status">Select Shelf Location Status</option>-->
<!--                                            </select>-->
<!--                                        </div>-->
<!--                                    </div>-->
<!--                                </div>-->
                                <!-- buttons -->
                                <div class="row mt-2">
                                    <div class="col-6 text-start">
                                        <button class="btn fw-bold form-btn button-clear" id="buttonClearInnerForm" type="reset">
                                            <i class="fa-solid fa-recycle" style="color: #a3a3a3;"></i>
                                        </button>
                                    </div>
                                    <div class="col-6 text-end">
                                        <button class="btn fw-bold form-btn button-update" id="buttonUpdateInnerForm" type="button"
                                                onclick="innerShelfLocationUpdate()">
                                            <i class="fa-solid fa-pen-to-square" style="color: #ffa600;"></i>
                                        </button>
                                        <button class="btn fw-bold form-btn button-submit" id="buttonSubmitInnerForm" type="button"
                                                onclick="innerShelfLocationSubmit()">
                                            <i class="fa-solid fa-square-plus" style="color: #00c86e;"></i>
                                        </button>
                                    </div>

                                </div>
                            </form>
                            <div class="row m-1">
                                <table class="table table-bordered">
                                    <thead id="tableHeadShelfLocations" class="table-head text-center">
                                    <th>#</th>
                                    <th>Location Code</th>
                                    <th>Bulding No</th>
                                    <th>Floor No</th>
                                    <th>Rack No</th>
                                    <th>Row No</th>
                                    <th>Modify</th>

                                    </thead>
                                    <tbody id="tableBodyShelfLocations" class="table-head text-center">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <!-- buttons -->
                    <div class="row">
                        <div class="col-6">

                        </div>

                        <div class="col-6 text-end">
                            <button class="btn fw-bold form-btn button-clear" id="buttonClear" type="button">
                                <i class="fa-solid fa-recycle" style="color: #a3a3a3;"></i>
                                Clear
                            </button>


                            <button class="btn fw-bold form-btn button-print" id="buttonPrint" type="button"
                                    onclick="printShelfLocationRecord(window['editOb'])">
                                <i class="fa-solid fa-print" style="color: #006eff;"></i>
                                Print
                            </button>


                            <button class="btn fw-bold form-btn button-delete" id="buttonDelete" type="button"
                                    onclick="deleteShelfLocationRecord(window['editOb'])">
                                <i class="fa-solid fa-trash" style="color: #fa0000;"></i>
                                Delete
                            </button>

                            <button class="btn fw-bold form-btn button-update" id="buttonUpdate" type="submit"
                                    onclick="shelfLocationUpdateButton()">
                                <i class="fa-solid fa-pen-to-square" style="color: #ffa600;"></i>
                                Update
                            </button>


                            <button class="btn fw-bold form-btn button-submit" id="buttonSubmit" type="submit"
                                    onclick="shelfLocationSubmitButton()">
                                <i class="fa-solid fa-floppy-disk" style="color: #00c86e;"></i>
                                Submit
                            </button>

                        </div>
                    </div>
                </div>
            </div>

        </div>
        <!-- table -->
        <div class="tab-pane fade" id="shelfLocationTabPillTable" role="tabpanel" aria-labelledby="shelfLocationTabPillTable"
             tabindex="0">
            <div class="card m-1">
                <div class="card-header">
                </div>
                <div class="card-body">
                    <table class="table table-bordered" id="tableShelfLocation">
                        <thead id="tableHeadShelfLocation" class="table-head text-center">
                        <tr>
                            <th>#</th>
                            <th>Display Category</th>
                            <th>Shelf Locations</th>
                        </tr>
                        </thead>
                        <tbody id="tableBodyShelfLocation" class="table-body text-center"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <div class="modal" id="modalShelfLocationView" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>View Shelf Locations</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="card" id="divCardPrintShelfLocation">
                        <div class="card-header">
                            <h1>Shelf Location details</h1>
                        </div>
                        <div class="card-body">
                            <table class="table table-hover table-striped table-bordered ">
                                <tr>
                                    <th>Display Category</th>
                                    <td id="tdDisplayCategory"></td>
                                </tr>
                                <tr>
                                    <td colspan="2" style="text-align: center; font-weight: bold;">
                                        Shelf Locations
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2"  id="tdShelfLocations"></td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer text-end">
                    <button type="button" class="btn" onclick="printShelfLocations()">Print</button>
                </div>
            </div>
        </div>
    </div>


</div>
<div th:replace="~{footerfragment::bottomFragment}"></div>
<!-- link purchase js -->
<script src="controljs/shelflocation.js"></script>

</body>

</html>
